<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- The site's heat colors: cool at the center (small primes), hot at the edge (big ones). -->
    <radialGradient id="heat" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="236">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="0.38" stop-color="#9a7cff"/>
      <stop offset="0.62" stop-color="#ff6aa8"/>
      <stop offset="0.82" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff2d2d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  <!-- A square spiral, the path the Ulam spiral writes the numbers along. -->
  <path d="M216 276 V196 H296 V356 H136 V116 H376 V396" fill="none" stroke="url(#heat)" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
